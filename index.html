<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الإنجليزية B2</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--sub:#667085;--main:#2f6fed;--line:#e3e7ef;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1c2230;--text:#eef1f7;--sub:#9aa4b8;--main:#6b9bff;--line:#2b3347}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1c2230;--text:#eef1f7;--sub:#9aa4b8;--main:#6b9bff;--line:#2b3347}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;max-width:520px;margin-inline:auto;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:16px;font-size:20px;font-weight:700}
header button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 12px;font-size:18px;cursor:pointer}
main{padding:0 16px 24px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 10px;text-align:center;font-size:17px;font-weight:600;cursor:pointer;color:var(--text)}
.tile small{display:block;color:var(--sub);font-weight:400;margin-top:6px;font-size:13px}
.tile .ic{font-size:30px;display:block;margin-bottom:6px}
.tile.wide{grid-column:1/-1;background:var(--main);color:#fff;border:none}
.tile.wide small{color:#e6eeff}
.word{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;color:var(--text);font-size:inherit;text-align:start}
.en{font-size:19px;font-weight:700;direction:ltr;display:inline-block}
.ar{color:var(--sub);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;line-height:1.9}
.ex{direction:ltr;text-align:left;background:var(--bg);border-radius:10px;padding:8px 12px;margin:8px 0;cursor:pointer;font-weight:600}
.opt{display:block;width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;margin-bottom:10px;font-size:17px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.no{border-color:var(--bad);background:rgba(220,38,38,.15)}
.q{font-size:28px;font-weight:700;text-align:center;direction:ltr;margin:20px 0}
.meta{color:var(--sub);text-align:center;margin-bottom:10px}
.next{background:var(--main);color:#fff;border:none;border-radius:12px;padding:14px;width:100%;font-size:17px;cursor:pointer}
.grid.letters{grid-template-columns:repeat(4,1fr)}.letter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 0;text-align:center;font-size:22px;font-weight:700;cursor:pointer;color:var(--main)}.letter small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.act span{cursor:pointer;font-size:18px;margin-inline-start:6px}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="رجوع">→</button><span id="title">الإنجليزية B2</span><button id="theme" style="margin-inline-start:auto" aria-label="الوضع">🌓</button></header>
<main id="app"></main>
<script>
function P(s){return s.split(",").map(function(x){var p=x.split("|");return {en:p[0],ar:p[1]}})}
var WORDS=P("achieve|يحقق,affect|يؤثر على,approach|أسلوب / نهج,aspect|جانب,assume|يفترض,benefit|فائدة,challenge|تحدٍّ,concern|قلق / يخص,consider|يعتبر / يفكر في,consequence|عاقبة,contribute|يساهم,develop|يطوّر,effort|جهد,environment|بيئة,evidence|دليل,expect|يتوقع,factor|عامل,improve|يحسّن,influence|تأثير,involve|يتضمن,likely|محتمل,obtain|يحصل على,opportunity|فرصة,particular|محدد / معيّن,perform|يؤدي,previous|سابق,process|عملية,provide|يوفّر,reduce|يقلل,relevant|ذو صلة,require|يتطلب,research|بحث,resource|مورد,respond|يستجيب,significant|مهم / ملحوظ,solution|حل,standard|معيار,suggest|يقترح,support|يدعم,tend|يميل إلى,valid|صالح / منطقي,reliable|موثوق,essential|ضروري,reluctant|متردد,efficient|فعّال,flexible|مرن,aware|مدرك,afford|يتحمل تكلفة,apply|يتقدم / يطبّق,claim|يدّعي,estimate|يقدّر,ensure|يضمن");
var PV=P("give up|يتخلى / يستسلم,carry on|يواصل,come up with|يبتكر,figure out|يكتشف / يفهم,find out|يعرف / يكتشف,look into|يتحقق في,put off|يؤجّل,set up|يؤسّس,turn down|يرفض,take over|يتولى,break down|يتعطل,bring up|يربّي / يثير موضوعاً,call off|يلغي,cut down on|يقلل من,deal with|يتعامل مع,end up|ينتهي به الحال,get along with|ينسجم مع,get over|يتعافى من,look forward to|يتطلع إلى,run out of|ينفد منه,point out|يشير إلى,sort out|يحلّ / يرتّب,take up|يبدأ هواية,work out|يتمرّن / ينجح,make up|يختلق / يتصالح");
var CON=P("however|ومع ذلك,therefore|لذلك,although|رغم أن,despite|بالرغم من,moreover|علاوة على ذلك,whereas|بينما,in addition|بالإضافة إلى ذلك,as a result|نتيجة لذلك,on the other hand|من ناحية أخرى,nevertheless|مع ذلك,unless|ما لم,in order to|من أجل,due to|بسبب,instead of|بدلاً من,apart from|ما عدا,in spite of|رغم,as long as|طالما,even though|حتى لو");
var GR=[
{t:"Present Perfect مقابل Past Simple",b:["نستخدم Present Perfect (have/has + V3) لشيء حصل في وقت غير محدد أو له أثر دلوقتي، وPast Simple لوقت محدد في الماضي.","EN:I have lived here for five years.","EN:I lived in Cairo in 2019.","EN:She has already finished her work.","علامات Past Simple: yesterday, ago, last year. علامات Present Perfect: since, for, already, yet, ever."]},
{t:"الجمل الشرطية Conditionals",b:["Type 1 (محتمل): If + present, will + verb","EN:If it rains, I will stay home.","Type 2 (خيالي في الحاضر): If + past, would + verb","EN:If I had more money, I would travel.","Type 3 (ماضي مستحيل): If + had + V3, would have + V3","EN:If I had studied, I would have passed.","Mixed: شرط في الماضي ونتيجة في الحاضر.","EN:If I had slept early, I would feel better now."]},
{t:"المبني للمجهول Passive",b:["الشكل: be + V3. بنستخدمه لما الفاعل مش مهم أو مجهول.","EN:The report was written by the manager.","EN:English is spoken all over the world.","EN:The project has been completed.","EN:The bridge will be built next year."]},
{t:"الكلام المنقول Reported Speech",b:["لما ننقل كلام، الزمن بيرجع خطوة للخلف.","EN:\"I am tired.\" → She said that she was tired.","EN:\"I will come.\" → He said he would come.","EN:\"I have finished.\" → She said she had finished.","وفي الأسئلة بنستخدم ترتيب الجملة العادي:","EN:He asked me where I lived."]},
{t:"Relative Clauses (who / which / that)",b:["who للأشخاص، which للأشياء، that للاتنين، whose للملكية.","EN:The man who called you is my boss.","EN:The book which I bought is excellent.","EN:The woman whose car was stolen is upset.","جمل بمعلومات إضافية بتتحط بين فواصل:","EN:My brother, who lives in Dubai, is an engineer."]},
{t:"Wish و If only",b:["نتمنى حاجة مختلفة عن الواقع.","حاضر: wish + past","EN:I wish I had more time.","ماضي: wish + had + V3","EN:I wish I had studied harder.","مستقبل / شكوى: wish + would","EN:I wish he would stop talking."]}];
var app=document.getElementById("app"),titleEl=document.getElementById("title"),backBtn=document.getElementById("back"),stack=[];
var VOICE=null;
function pickVoice(){try{var v=speechSynthesis.getVoices();VOICE=v.filter(function(x){return /^en[-_]US/i.test(x.lang)})[0]||v.filter(function(x){return /^en/i.test(x.lang)})[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function toast(m){var d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:9";document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}
function speak(t){try{if(window.Android&&window.Android.speak){window.Android.speak(String(t).split(" / ").join(", "));return}if(!window.speechSynthesis){toast("جهازك مش بيدعم النطق الصوتي");return}speechSynthesis.cancel();t=String(t).split(" / ").join(", ");var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.85;if(VOICE)u.voice=VOICE;u.onerror=function(){toast("تعذّر تشغيل الصوت، تأكد من رفع الصوت")};speechSynthesis.speak(u)}catch(e){toast("تعذّر تشغيل الصوت")}}
function go(fn){stack.push(fn);fn();if(stack.length>1){try{location.hash="v"+stack.length}catch(e){}}}
backBtn.onclick=function(){var before=stack.length;if(before<2)return;if(location.hash){try{history.back()}catch(e){}}setTimeout(function(){if(stack.length===before){stack.pop();var f=stack[stack.length-1];if(f)f()}},200)};
window.addEventListener("hashchange",function(){var n=parseInt(location.hash.replace("#v",""),10)||1;if(n<stack.length){while(stack.length>n)stack.pop();var f=stack[stack.length-1];if(f)f()}});
function frame(t){titleEl.textContent=t;backBtn.hidden=stack.length<2;app.innerHTML=""}
function tile(p,ic,n,s,fn,c){var b=document.createElement("button");b.className="tile "+(c||"");b.innerHTML='<span class="ic">'+ic+'</span>'+n+'<small>'+s+'</small>';b.onclick=fn;p.appendChild(b)}
function home(){
  frame("تعلّم الإنجليزية");searchBox();
  var g=document.createElement("div");g.className="grid";
  tile(g,"📚","أهم الكلمات","من A إلى Z",function(){go(alphabet)},"wide");
  tile(g,"📖","القواعد",GR.length+" دروس",function(){go(grammar)});
  tile(g,"🏃","أهم الأفعال",verbs().length+" فعل",function(){go(function(){list("أهم الأفعال",verbs())})});
  tile(g,"🏷️","أهم الأسماء",NOUN.length+" اسم",function(){go(function(){list("أهم الأسماء",NOUN)})});
  tile(g,"🎨","أهم الصفات",ADJ.length+" صفة",function(){go(function(){list("أهم الصفات",ADJ)})});
  tile(g,"⏱️","أهم الظروف",ADV.length+" ظرف",function(){go(function(){list("أهم الظروف",ADV)})});
  tile(g,"🧩","كلمات متنوعة",Object.keys(TOPICS).length+" موضوع",function(){go(topics)});
  tile(g,"🔗","Phrasal Verbs",PV.length+" فعل",function(){go(function(){list("Phrasal Verbs",PV)})});
  tile(g,"🧩","كلمات الربط",CON.length+" كلمة",function(){go(function(){list("كلمات الربط",CON)})});
  tile(g,"📍","حروف الجر",PREP.length+" حرف",function(){go(function(){list("حروف الجر",PREP)})});
  tile(g,"🔁","الأفعال الشاذة",IRR.length+" فعل",function(){go(function(){list("الأفعال الشاذة",IRR)})});
  tile(g,"❤️","المفضلة",Object.keys(ST.fav).length+" كلمة",function(){myList(ST.fav,"المفضلة","لسه مضفتش كلمات. اضغط 🤍 جنب أي كلمة")});
  tile(g,"🔁","مراجعتي",Object.keys(ST.wrong).length+" كلمة",function(){myList(ST.wrong,"كلمات أخطأت فيها","مفيش أخطاء لسه. جرّب الاختبار")});
  if(window.Android&&window.Android.setReminder)tile(g,"⏰","تذكير يومي",(Android.getReminder()||"مغلق"),function(){go(remScreen)},"wide");
  tile(g,"🧠","مراجعة ذكية",srsPick().length+" كلمة جاهزة النهاردة",function(){go(srsRun)},"wide");
  tile(g,"📝","اختبار ومراجعة","من كل الكلمات",function(){go(quiz)},"wide");
  app.appendChild(g);
  var kc=Object.keys(ST.known).length,tot=allWords().length,pc=Math.round(kc*100/tot);
  var t=document.createElement("div");t.style.marginTop="16px";t.innerHTML='<div class="meta"></div><div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden"><div class="pb" style="height:100%;background:var(--main)"></div></div>';t.firstChild.textContent="✅ حفظت "+kc+" من "+tot+" كلمة ("+pc+"%)  •  🔥 "+streak()+" يوم متتالي";t.querySelector(".pb").style.width=pc+"%";app.appendChild(t);
}
function alphabet(){
  frame("أهم الكلمات");
  var g=document.createElement("div");g.className="grid letters";
  Object.keys(ALPHA).sort().forEach(function(L){
    var l=uniq(P(ALPHA[L])),b=document.createElement("button");b.className="letter";
    b.innerHTML=L+"<small>"+l.length+"</small>";
    b.onclick=function(){go(function(){list("حرف "+L,l)})};g.appendChild(b);
  });
  app.appendChild(g);
}
function topics(){
  frame("كلمات متنوعة");
  var g=document.createElement("div");g.className="grid";
  Object.keys(TOPICS).forEach(function(k){
    var l=uniq(P(TOPICS[k]));
    tile(g,ICONS[k]||"📌",k,l.length+" كلمة",function(){go(function(){list(k,l)})});
  });
  app.appendChild(g);
}
function list(t,arr){if(t.indexOf("الشاذة")<0)arr=sortLv(arr);markDay();
  frame(t);
  arr.forEach(function(w){
    var b=document.createElement("button");b.className="word";
    b.innerHTML='<span><span class="en"></span><br><span class="ar"></span></span><span class="act" style="text-align:left"><small class="lv" style="display:block;color:var(--sub)"></small><span class="fv"></span><span class="kn"></span>🔊</span>';
    b.querySelector(".en").textContent=w.en;b.querySelector(".ar").textContent=w.ar;b.querySelector(".lv").textContent=["","⭐ أساسي","⭐⭐ متوسط","⭐⭐⭐ متقدم"][lvl(w)];
    var k=w.en.toLowerCase(),fv=b.querySelector(".fv"),kn=b.querySelector(".kn");
    function paint(){fv.textContent=ST.fav[k]?"❤️":"🤍";kn.textContent=ST.known[k]?"✅":"⬜";b.style.opacity=ST.known[k]?0.6:1}
    paint();
    fv.onclick=function(e){e.stopPropagation();if(ST.fav[k])delete ST.fav[k];else ST.fav[k]=w;save();paint()};
    kn.onclick=function(e){e.stopPropagation();if(ST.known[k])delete ST.known[k];else ST.known[k]=1;save();paint()};
    b.onclick=function(){speak(w.en)};app.appendChild(b);
  });
}
function grammar(){
  frame("القواعد");
  GR.forEach(function(l,i){
    var b=document.createElement("button");b.className="word";
    b.innerHTML='<span class="ar" style="color:inherit;font-weight:700"></span><span>←</span>';
    b.firstChild.textContent=(i+1)+". "+l.t;
    b.onclick=function(){go(function(){lesson(l)})};app.appendChild(b);
  });
}
function lesson(l){
  frame(l.t);
  var c=document.createElement("div");c.className="card";
  l.b.forEach(function(x){
    var d=document.createElement("div");
    if(x.indexOf("EN:")===0){
      var s=x.slice(3);d.className="ex";d.textContent="🔊 "+s;
      d.onclick=function(){speak(s.replace(/→.*/,"").replace(/["]/g,""))};
    }else d.textContent=x;
    c.appendChild(d);
  });
  app.appendChild(c);addEx(l);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function quiz(){frame("اختبار ومراجعة");var m=document.createElement("div");m.className="meta";m.textContent="اختار مستوى الأسئلة";app.appendChild(m);[[1,"⭐ أساسي"],[2,"⭐⭐ متوسط"],[3,"⭐⭐⭐ متقدم"],[0,"🎲 مختلط (من كل المستويات)"]].forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x[1];b.onclick=function(){go(function(){quizRun(x[0])})};app.appendChild(b)})}
function quizRun(LV){
  var all=allWords(),pool=LV?all.filter(function(w){return lvl(w)===LV}):all,qs=shuffle(pool).slice(0,10),i=0,score=0;
  function show(){
    frame("اختبار ومراجعة");
    if(i>=qs.length){
      app.innerHTML='<div class="card" style="text-align:center;font-size:20px">نتيجتك: '+score+' من '+qs.length+(score>=8?" 🌟 ممتاز":score>=5?" 👍 كويس":" 💪 راجع تاني")+'</div>';
      var b=document.createElement("button");b.className="next";b.textContent="اختبار جديد";
      b.onclick=function(){stack.pop();go(quiz)};app.appendChild(b);return;
    }
    var q=qs[i],opts=shuffle([q].concat(shuffle(pool.filter(function(x){return x.en!==q.en&&x.ar!==q.ar})).slice(0,3)));
    var m=document.createElement("div");m.className="meta";m.textContent="سؤال "+(i+1)+" من "+qs.length;app.appendChild(m);
    var h=document.createElement("div");h.className="q";h.textContent=q.en;h.onclick=function(){speak(q.en)};app.appendChild(h);
    var done=false;
    opts.forEach(function(o){
      var b=document.createElement("button");b.className="opt";b.textContent=o.ar;
      b.onclick=function(){
        if(done)return;done=true;
        if(o.en===q.en){b.classList.add("ok");score++;if(ST.wrong[q.en.toLowerCase()]){delete ST.wrong[q.en.toLowerCase()];save()}}
        else{ST.wrong[q.en.toLowerCase()]=q;save();b.classList.add("no");[].forEach.call(app.querySelectorAll(".opt"),function(x){if(x.textContent===q.ar)x.classList.add("ok")})}
        speak(q.en);
        var n=document.createElement("button");n.className="next";n.textContent="التالي";
        n.onclick=function(){i++;show()};app.appendChild(n);
      };
      app.appendChild(b);
    });
  }
  show();
}

"To Be":T("الفعل To Be (am / is / are / was / were)","📌 معناه يكون أو يوجد. بنستخدمه للوصف والحالة والهوية والمكان والعمر. في العربي بنحذفه (أنا طالب) لكن في الإنجليزي لازم نكتبه.","الحاضر: I am • he / she / it is • we / you / they are","الماضي: I / he / she / it was • we / you / they were","✅ إيجابي: S + be + ...  ❌ نفي: S + be + not  ❓ سؤال: Be + S + ... ?","EN:I am a student.","EN:She is not at home.","EN:Are you hungry?","EN:We were in Cairo last year.","EN:Was he late?","الاختصارات: I'm, he's, she's, we're, they're, isn't, aren't, wasn't, weren't","EN:They're my friends.","⚠️ تنبيه: لا نقول I am agree. الصح I agree، لأن agree فعل بالفعل. ولا نقول He is go. الصح He goes."),
"Modal Verbs":T("الأفعال الناقصة Modal Verbs","📌 أفعال مساعدة بتضيف معنى للفعل: can, could, may, might, must, should, would, will. القاعدة: Modal + V1 (من غير to ومن غير s).","can: قدرة أو إذن • could: قدرة في الماضي أو طلب مؤدب • may / might: احتمال أو إذن رسمي • must: واجب قوي • should: نصيحة • would: طلب مؤدب","EN:I can swim.","EN:Could you open the window, please?","EN:It might rain later.","EN:You should see a doctor.","EN:Students must wear uniforms.","❌ النفي: cannot / can't, couldn't, mustn't, shouldn't, wouldn't","❓ السؤال: بنقدم الـ modal على الفاعل","EN:Can I come in?","⚠️ تنبيه: مفيش s مع he (He can swim ✓)، ومفيش to بعدها (She must go ✓)."),
"a / an":T("أدوات التعريف a / an / the","📌 a / an: لأي شيء غير محدد، مع المفرد المعدود فقط. a قبل صوت ساكن (a book) وan قبل صوت متحرك (an apple, an hour).","📌 the: لشيء معروف للمتكلم والسامع، أو اتذكر قبل كده، أو فريد في العالم (the sun, the moon).","❌ من غير أداة: الجمع والمعدود بشكل عام، أسماء الدول والأشخاص، اللغات، الوجبات، الرياضات.","EN:I need a pen.","EN:She is an engineer.","EN:I saw a dog. The dog was big.","EN:The sun rises in the east.","EN:I love music.","EN:We have breakfast at eight.","⚠️ تنبيه: النطق هو اللي يحدد، فنقول an hour (h ساكنة) و a university (بتبدأ بصوت y)."),
"Comparatives":T("المقارنة Comparatives & Superlatives","📌 comparative للمقارنة بين اتنين (than)، وsuperlative للأعلى بين أكتر من اتنين (the + ...est).","صفة قصيرة (مقطع واحد): + er / the + est → tall, taller, the tallest","صفة قصيرة بتنتهي بمتحرك + حرف ساكن: نضاعف الحرف → big, bigger, the biggest","صفة بتنتهي بـ y: نغير y إلى i → happy, happier, the happiest","صفة طويلة (مقطعين فأكتر): more / the most → expensive, more expensive, the most expensive","شاذة: good ← better ← best • bad ← worse ← worst • far ← farther ← farthest","EN:This bag is cheaper than that one.","EN:She is more intelligent than her brother.","EN:It is the most expensive hotel in the city.","EN:He is the best player in the team.","المساواة: as + صفة + as","EN:My car is as fast as yours.","⚠️ تنبيه: لا نقول more taller. إما taller أو more beautiful."),
"Passive":T("المبني للمجهول Passive Voice","📌 بنستخدمه لما الفاعل مجهول أو مش مهم، أو لما الاهتمام بالمفعول. الشكل: be (حسب الزمن) + V3. المفعول في الجملة العادية بيبقى فاعل في الـ Passive.","حاضر بسيط: am / is / are + V3 • ماضي بسيط: was / were + V3 • مستقبل: will be + V3 • حاضر تام: have / has been + V3 • حاضر مستمر: am / is / are being + V3","EN:The company builds cars. → Cars are built by the company.","EN:Someone stole my bike. → My bike was stolen.","EN:They will announce the results. → The results will be announced.","EN:The room has been cleaned.","لو عايز تذكر الفاعل الأصلي: by + الفاعل.","⚠️ تنبيه: الأفعال اللي من غير مفعول (happen, arrive, die, sleep) مفيهاش Passive."),
"Conditionals":T("الجمل الشرطية Conditionals","📌 الجملة الشرطية = If + الشرط، + النتيجة.","Zero (حقائق): If + present, present","EN:If you heat ice, it melts.","First (محتمل): If + present, will + V1","EN:If it rains, I will stay home.","Second (خيالي في الحاضر): If + past, would + V1","EN:If I were rich, I would travel the world.","Third (ماضي مستحيل): If + had + V3, would have + V3","EN:If I had studied, I would have passed.","Mixed (شرط ماضي ونتيجة حاضرة):","EN:If I had slept early, I would feel better now.","unless = if not:","EN:Unless you hurry, you will be late.","⚠️ تنبيه: لا نضع will بعد if (If it rains ✓). وفي النوع الثاني نقول If I were مع كل الضمائر."),
"Reported":T("الكلام المنقول Reported Speech","📌 بننقل كلام حد من غير ما نكرره حرفياً. لما الفعل الأساسي في الماضي (said) الزمن بيرجع خطوة للخلف:","am / is / are ← was / were • do / does ← did • did ← had + V3 • have / has ← had • will ← would • can ← could • may ← might • must ← had to","الضمائر والظروف بتتغير: now ← then • today ← that day • tomorrow ← the next day • yesterday ← the day before • here ← there","EN:She said, I am tired. → She said that she was tired.","EN:He said, I will call you. → He said that he would call me.","الأسئلة: ترتيب الجملة العادي بدون do، مع ask + if / كلمة الاستفهام","EN:He asked me where I lived.","EN:She asked if I was ready.","الأوامر: tell / ask + مفعول + to + V1","EN:He told me to sit down.","⚠️ تنبيه: لو الكلام لسه صحيح دلوقتي ممكن منرجعش الزمن."),
"Relative":T("الجمل الموصولة Relative Clauses","📌 جملة بتحدد أو بتوصف اسم قبلها: who (شخص) • which (شيء) • that (شخص أو شيء) • whose (ملكية) • where (مكان) • when (وقت).","Defining: ضرورية للمعنى، من غير فواصل، وممكن that:","EN:The man who called you is my boss.","EN:The book that I bought is great.","Non-defining: معلومة إضافية، بين فواصل، ومينفعش that:","EN:My brother, who lives in Dubai, is an engineer.","EN:The woman whose car was stolen is upset.","EN:This is the city where I was born.","بنقدر نحذف who / which / that لو هو المفعول:","EN:The book I bought is great.","⚠️ تنبيه: لا نكرر الضمير: The man who called me ✓ (مش who he called me)."),
"Pronouns":T("الضمائر Pronouns","الفاعل: I, you, he, she, it, we, they","المفعول: me, you, him, her, it, us, them","صفة الملكية (قبل الاسم): my, your, his, her, its, our, their","ضمير الملكية (مستقل): mine, yours, his, hers, ours, theirs","الانعكاسي: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves","EN:She gave me her book.","EN:This bag is mine.","EN:He hurt himself.","EN:We did it ourselves.","⚠️ تنبيه: لا نقول hisself ولا theirselves. الصح himself وthemselves."),
"much":T("المعدود وغير المعدود much / many","📌 معدود: ينفع نعده (book, student). غير معدود: ماينفعش (water, money, time, advice, information, news).","معدود: many • a few • fewer • how many","غير معدود: much • a little • less • how much","للاتنين: a lot of • some • any • plenty of","EN:How many books do you have?","EN:I don't have much time.","EN:She has a lot of friends.","EN:There are a few apples.","EN:We have a little milk.","⚠️ تنبيه: information وadvice وnews غير معدودة، فلا نقول informations ولا an advice."),
"There is":T("There is / There are","📌 للدلالة على وجود شيء. there is للمفرد وغير المعدود، there are للجمع. الماضي: there was / there were.","❌ نفي: there isn't / there aren't ❓ سؤال: Is there ...? / Are there ...?","EN:There is a book on the table.","EN:There are three students in the class.","EN:Is there any milk in the fridge?","EN:There weren't any seats.","الفرق عن it is: there is لوجود شيء، وit is لوصف شيء معروف.","EN:It is a big house."),
